<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wraithworks</title>
    <!-- Fontlar: Başlık için Serif, genel metinler için Retro/Pixel stili -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #24201b;
            --btn-normal: #8b7965;
            --btn-active: #dac9b1;
            --border-dark: #1b1612;
            --text-dark: #221d18;
            --text-light: #e0d4c3;
            --overlay-color: rgba(218, 201, 177, 0.92);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Arka plan resmi buraya tanımlandı */
            background-image: url('image_9eddd6.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'VT323', monospace;
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* HEADER & LOGO */
        header {
            background-color: var(--bg-dark);
            text-align: center;
            padding: 20px 0 0 0;
            border-bottom: 4px solid var(--border-dark);
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            color: var(--text-light);
            letter-spacing: 4px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Sekmeler (Tabs) */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            transform: translateY(4px); /* Butonları alt çizgiye oturtmak için */
        }

        .tab-btn {
            background-color: var(--btn-normal);
            border: 4px solid var(--border-dark);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            color: var(--text-dark);
            font-family: 'VT323', monospace;
            font-size: 22px;
            padding: 8px 30px;
            cursor: pointer;
            box-shadow: inset 2px 2px 0px rgba(255, 255, 255, 0.15);
            transition: background-color 0.2s;
        }

        .tab-btn:hover {
            background-color: #9d8b76;
        }

        .tab-btn.active {
            background-color: var(--btn-active);
            border-bottom: 4px solid var(--btn-active); /* Alt çizgiyi kapatır */
            margin-bottom: -4px;
            padding-bottom: 12px;
        }

        /* İÇERİK ALANI */
        main {
            flex-grow: 1;
            position: relative;
        }

        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
        }

        .tab-content.active {
            display: block;
        }

        /* HOME SEKME İÇERİĞİ */
        #home {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
        }
        
        #home.active {
            display: flex;
        }

        .social-container {
            display: flex;
            gap: 50px;
            margin-top: -50px;
        }

        .social-btn-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }

        .social-icon {
            width: 70px;
            height: 70px;
            background-color: var(--btn-normal);
            border: 4px solid var(--border-dark);
            border-radius: 12px;
            margin-bottom: -15px; /* İkonu butonun üstüne bindiriyoruz */
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            box-shadow: inset 3px 3px 0px rgba(255, 255, 255, 0.15), 0px 4px 0px rgba(0,0,0,0.3);
            color: var(--text-dark);
        }

        .social-label {
            background-color: var(--btn-normal);
            border: 4px solid var(--border-dark);
            border-radius: 8px;
            padding: 15px 40px;
            font-size: 28px;
            color: var(--text-dark);
            box-shadow: inset 3px 3px 0px rgba(255, 255, 255, 0.15), 0px 4px 0px rgba(0,0,0,0.3);
            z-index: 1;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .social-btn-wrapper:hover .social-icon,
        .social-btn-wrapper:hover .social-label {
            background-color: var(--btn-active);
        }

        .social-btn-wrapper:active .social-label,
        .social-btn-wrapper:active .social-icon {
            transform: translateY(4px);
            box-shadow: inset 3px 3px 0px rgba(255, 255, 255, 0.15), 0px 0px 0px rgba(0,0,0,0.3);
        }

        .footer-text {
            position: absolute;
            bottom: 30px;
            color: var(--text-light);
            font-size: 20px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* DİĞER SEKMELER (PROJECTS, ABOUT, CONTACT) */
        .content-panel {
            background-color: var(--overlay-color);
            border-top: 4px solid var(--border-dark);
            height: 100%;
            padding: 40px;
            overflow-y: auto;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .project-card {
            background-color: var(--bg-dark);
            border: 4px solid var(--border-dark);
            border-radius: 8px;
            height: 180px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 15px;
            color: var(--text-light);
            font-size: 24px;
            box-shadow: inset 0px 0px 20px rgba(0,0,0,0.8);
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .project-card:hover {
            transform: scale(1.02);
        }

        .page-title {
            text-align: center;
            font-size: 36px;
            margin-bottom: 20px;
            border-bottom: 2px dashed var(--border-dark);
            padding-bottom: 10px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .page-text {
            text-align: center;
            font-size: 24px;
        }

    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>❂</span> WRAITHWORKS
        </div>
        <nav class="tabs">
            <button class="tab-btn active" onclick="openTab(event, 'home')">HOME</button>
            <button class="tab-btn" onclick="openTab(event, 'projects')">PROJECTS</button>
            <button class="tab-btn" onclick="openTab(event, 'about')">ABOUT</button>
            <button class="tab-btn" onclick="openTab(event, 'contact')">CONTACT</button>
        </nav>
    </header>

    <main>
        <!-- HOME SEKME -->
        <div id="home" class="tab-content active">
            <div class="social-container">
                <!-- Discord Butonu -->
                <a href="https://discord.gg/U6AxhptYNe" target="_blank" class="social-btn-wrapper">
                    <div class="social-icon">
                        <img src="https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0a6918e57475a843f59f_icon_clyde_black_RGB.svg" alt="Discord" style="width: 40px; opacity: 0.8;">
                    </div>
                    <div class="social-label">DISCORD</div>
                </a>

                <!-- Instagram Butonu -->
                <a href="https://www.instagram.com/wraithworks0" target="_blank" class="social-btn-wrapper">
                    <div class="social-icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#221d18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    </div>
                    <div class="social-label">INSTAGRAM</div>
                </a>
            </div>
            
            <div class="footer-text">FOLLOW THE UNSEEN PATH</div>
        </div>

        <!-- PROJECTS SEKME -->
        <div id="projects" class="tab-content content-panel">
            <h2 class="page-title">OUR PROJECTS</h2>
            <div class="projects-grid">
                <div class="project-card">MISTWALKERS</div>
                <div class="project-card">LOST SIGNAL</div>
                <div class="project-card">PROJECT INFO</div>
                <div class="project-card">LOST SIGNAL</div>
                <div class="project-card">LOST SIGNAL</div>
                <div class="project-card">PROJECT INFO</div>
            </div>
        </div>

        <!-- ABOUT SEKME -->
        <div id="about" class="tab-content content-panel">
            <h2 class="page-title">ABOUT US</h2>
            <p class="page-text">We are Wraithworks. Building immersive atmospheric experiences.</p>
        </div>

        <!-- CONTACT SEKME -->
        <div id="contact" class="tab-content content-panel">
            <h2 class="page-title">CONTACT</h2>
            <p class="page-text">Reach out to us via our social channels to join the journey.</p>
        </div>
    </main>

    <script>
        function openTab(evt, tabName) {
            // Tüm içerikleri gizle
            let tabContents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < tabContents.length; i++) {
                tabContents[i].classList.remove("active");
            }

            // Tüm butonların aktiflik durumunu kaldır
            let tabBtns = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tabBtns.length; i++) {
                tabBtns[i].classList.remove("active");
            }

            // Tıklanan sekmeyi ve butonu aktif yap
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
</body>
</html>
