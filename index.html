<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wraithworks</title>
    
    <style>
        :root {
            --bg-dark: #24201b;
            --btn-normal: #8b7965;
            --btn-active: #dac9b1;
            --border-dark: #1b1612;
            --text-dark: #221d18;
            --text-light: #e0d4c3;
            --overlay-color: rgba(218, 201, 177, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Georgia, serif;
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            background-color: transparent;
        }

        body::before {
            content: "";
            position: fixed;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            z-index: -1;
        }

        header {
            background-color: rgba(36, 32, 27, 0.95);
            text-align: center;
            padding: 20px 0 0 0;
            border-bottom: 4px solid var(--border-dark);
        }

        .logo {
            font-size: 32px;
            color: var(--text-light);
            letter-spacing: 4px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: bold;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            transform: translateY(4px);
        }

        .tab-btn {
            background-color: var(--btn-normal);
            border: 4px solid var(--border-dark);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            color: var(--text-dark);
            font-family: Georgia, serif;
            font-size: 18px;
            font-weight: bold;
            padding: 10px 30px;
            cursor: pointer;
            box-shadow: inset 2px 2px 0px rgba(255, 255, 255, 0.15);
            transition: background-color 0.2s;
        }

        .tab-btn:hover {
            background-color: #9d8b76;
        }

        .tab-btn.active {
            background-color: var(--btn-active);
            border-bottom: 4px solid var(--btn-active);
            margin-bottom: -4px;
            padding-bottom: 14px;
        }

        main {
            flex-grow: 1;
            position: relative;
        }

        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
        }

        .tab-content.active {
            display: block;
        }

        #home {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
        }
        
        #home.active {
            display: flex;
        }

        .social-container {
            display: flex;
            gap: 50px;
            margin-top: -50px;
        }

        .social-btn-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }

        .social-icon {
            width: 70px;
            height: 70px;
            background-color: var(--btn-normal);
            border: 4px solid var(--border-dark);
            border-radius: 12px;
            margin-bottom: -15px;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            box-shadow: inset 3px 3px 0px rgba(255, 255, 255, 0.15), 0px 4px 0px rgba(0,0,0,0.3);
            color: var(--text-dark);
        }

        .social-label {
            background-color: var(--btn-normal);
            border: 4px solid var(--border-dark);
            border-radius: 8px;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            color: var(--text-dark);
            box-shadow: inset 3px 3px 0px rgba(255, 255, 255, 0.15), 0px 4px 0px rgba(0,0,0,0.3);
            z-index: 1;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .social-btn-wrapper:hover .social-icon,
        .social-btn-wrapper:hover .social-label {
            background-color: var(--btn-active);
        }

        .social-btn-wrapper:active .social-label,
        .social-btn-wrapper:active .social-icon {
            transform: translateY(4px);
            box-shadow: inset 3px 3px 0px rgba(255, 255, 255, 0.15), 0px 0px 0px rgba(0,0,0,0.3);
        }

        .footer-text {
            position: absolute;
            bottom: 30px;
            color: var(--text-light);
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .content-panel {
            background-color: var(--overlay-color);
            border-top: 4px solid var(--border-dark);
            height: 100%;
            padding: 40px;
            overflow-y: auto;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .project-card {
            background-color: var(--bg-dark);
            border: 4px solid var(--border-dark);
            border-radius: 8px;
            height: 180px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 15px;
            color: var(--text-light);
            font-size: 20px;
            font-weight: bold;
            box-shadow: inset 0px 0px 20px rgba(0,0,0,0.8);
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .project-card:hover {
            transform: scale(1.02);
        }

        .page-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 20px;
            border-bottom: 2px dashed var(--border-dark);
            padding-bottom: 10px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .page-text {
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>❂</span> WRAITHWORKS
        </div>
        <nav class="tabs">
            <button class="tab-btn active" onclick="openTab(event, 'home')">HOME</button>
            <button class="tab-btn" onclick="openTab(event, 'projects')">PROJECTS</button>
            <button class="tab-btn" onclick="openTab(event, 'about')">ABOUT</button>
            <button class="tab-btn" onclick="openTab(event, 'contact')">CONTACT</button>
        </nav>
    </header>

    <main>
        <div id="home" class="tab-content active">
            <div class="social-container">
                <a href="https://discord.gg/U6AxhptYNe" target="_blank" class="social-btn-wrapper">
                    <div class="social-icon">
                        <img src="discord-icon.png" alt="Discord" style="width: 40px;">
                    </div>
                    <div class="social-label">DISCORD</div>
                </a>

                <a href="https://www.instagram.com/wraithworks0" target="_blank" class="social-btn-wrapper">
                    <div class="social-icon">
                        <img src="instagram-icon.png" alt="Instagram" style="width: 40px;">
                    </div>
                    <div class="social-label">INSTAGRAM</div>
                </a>
            </div>
            
            <div class="footer-text">FOLLOW THE UNSEEN PATH</div>
        </div>

        <div id="projects" class="tab-content content-panel">
            <h2 class="page-title">OUR PROJECTS</h2>
            <div class="projects-grid">
                <div class="project-card">MISTWALKERS</div>
                <div class="project-card">LOST SIGNAL</div>
                <div class="project-card">PROJECT INFO</div>
                <div class="project-card">LOST SIGNAL</div>
                <div class="project-card">LOST SIGNAL</div>
                <div class="project-card">PROJECT INFO</div>
            </div>
        </div>

        <div id="about" class="tab-content content-panel">
            <h2 class="page-title">ABOUT US</h2>
            <p class="page-text">We are Wraithworks. Building immersive atmospheric experiences.</p>
        </div>

        <div id="contact" class="tab-content content-panel">
            <h2 class="page-title">CONTACT</h2>
            <p class="page-text">Reach out to us via our social channels to join the journey.</p>
        </div>
    </main>

    <script>
        function openTab(evt, tabName) {
            let tabContents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < tabContents.length; i++) {
                tabContents[i].classList.remove("active");
            }

            let tabBtns = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tabBtns.length; i++) {
                tabBtns[i].classList.remove("active");
            }

            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
</body>
</html>
